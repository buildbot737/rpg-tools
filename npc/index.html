<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPC Generator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      background: #1f2937;
      box-shadow: 0 18px 80px rgba(15, 23, 42, 0.45);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
    }

    p {
      color: #cbd5e1;
      line-height: 1.75;
    }

    .controls {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-bottom: 24px;
    }

    .controls > div {
      min-width: 0;
    }

    label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111827;
      color: #f8fafc;
      font-size: 1rem;
      appearance: none;
    }

    button {
      appearance: none;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      padding: 14px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #22d3ee;
    }

    .note {
      margin-bottom: 20px;
      color: #94a3b8;
    }

    .copy-container {
        position: relative;
        border: 1px solid #ccc;
        padding: 16px;
    }

    .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        cursor: pointer;
        border: none;
        background: transparent;
        font-size: 18px;
    }

    .copy-btn:hover {
        opacity: 0.7;
    }

    .npc-output-box {
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
      white-space: pre-wrap;
      line-height: 1.75;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1em;
    }

    .npc-output-text {
      flex: 1;
      color: #f8fafc;
    }

    .npc-copy-btn {
      padding: 0.5em;
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    .npc-copy-btn:hover {
      color: #cbd5e1;
    }

    .npc-copy-btn.success {
      color: #4caf50;
    }

    .npc-copy-btn.error {
      color: #f44336;
    }

    .clipboard-textarea {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      padding: 0;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <div>
        <label for="universe-select">Universe</label>
        <select id="universe-select"></select>
      </div>

      <div>
        <label for="lineage-select">Lineage</label>
        <select id="lineage-select"></select>
      </div>

      <div>
        <label for="gender-select">Gender</label>
        <select id="gender-select"></select>
      </div>

      <div>
        <label for="count-input">NPC count</label>
        <input id="count-input" type="number" min="1" max="10" value="2" />
      </div>
    </div>

    <div class="controls">
      <button id="generate-button">Generate</button>
      <button id="clear-button">Clear</button>
    </div>

    <div id="output" class="output">
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
