<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>NPC Generator</title> -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      background: #1f2937;
      box-shadow: 0 18px 80px rgba(15, 23, 42, 0.45);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
    }

    p {
      color: #cbd5e1;
      line-height: 1.75;
    }

    .controls {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-bottom: 24px;
    }

    .controls > div {
      min-width: 0;
    }

    label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .button-link {
      appearance: none;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      padding: 14px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, background 0.15s ease;
      text-align: center;
    }

    .button-link:hover {
      transform: translateY(-1px);
      background: #22d3ee;
    }

    .center-text {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="center-text">RPG Tools</h3>
    <div class="controls">
      <a class="button-link" href="/npc">NPC</a>
      <a class="button-link" href="/tavern">Tavern</a>
    </div>
  </div>
</body>
</html>
